<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#FFFFFF"/>
<title>Me See Free</title>
<style>
  :root{
    --page:   #FFFFFF;
    --paper:  #FFFFFF;
    --ink:    #1F2937;
    --label:  #6B7280;
    --accent: #1D4ED8;
    --line:   #E5E7EB;
    --error:  #B3261E;
    --sans: Arial, Helvetica, "Liberation Sans", Arimo, sans-serif;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--page);
    color:var(--ink);
    font-family:var(--sans);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
  }

  .card{
    width:100%;
    max-width:340px;
    background:var(--paper);
    border-radius:12px;
    border:1px solid var(--line);
    box-shadow:0 1px 3px rgba(17,24,39,.06), 0 8px 24px -12px rgba(17,24,39,.12);
    padding:28px 26px 26px;
  }
  h1{
    margin:0 0 20px;
    font-size:.95rem;
    font-weight:600;
    letter-spacing:.02em;
  }
  label{
    display:block;
    font-size:.68rem;
    font-weight:600;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--label);
    margin:0 0 6px;
  }
  input{
    width:100%;
    font-family:inherit;
    font-size:.9rem;
    color:var(--ink);
    background:#fff;
    border:1px solid var(--line);
    border-radius:8px;
    padding:9px 11px;
    margin:0 0 16px;
  }
  input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  button{
    width:100%;
    font-family:inherit;
    font-size:.85rem;
    font-weight:600;
    color:var(--paper);
    background:var(--ink);
    border:none;
    border-radius:8px;
    padding:10px;
    cursor:pointer;
  }
  button:hover{background:#111827}
  .error{
    font-size:.78rem;
    color:var(--error);
    margin:-6px 0 16px;
  }
</style>
</head>
<body>

<main class="card">
  <h1>Sign in to Me See Free</h1>
  <p class="error" th:if="${error}">Wrong username or password.</p>
  <form method="post" action="/login">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" autocomplete="username" required autofocus/>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required/>
    <button type="submit">Sign in</button>
  </form>
</main>

</body>
</html>
